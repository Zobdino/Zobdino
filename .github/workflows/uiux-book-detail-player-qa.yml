name: UIUX Book Detail Player QA

on:
  push:
    branches:
      - design/253-book-detail-player-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Quality and audio contracts
        run: |
          npm run lint
          npm run typecheck
          npm run check:text
          npm run check:episodes
          npm run pipeline:voice:validate
          npm run voice:dual:resume:validate
          npm run build

      - name: Install Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Serve branch build
        shell: bash
        run: |
          python3 -m http.server 4173 --directory out > /tmp/zobdino-book-uiux.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/books/atomic-habits/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/zobdino-book-uiux.log
          exit 1

      - name: Chromium visual and playback regression
        shell: bash
        run: |
          mkdir -p .qa-book-uiux .qa-runner
          cat > .qa-runner/book-detail-player-qa.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs/promises';

          const url = 'http://127.0.0.1:4173/books/atomic-habits/';
          const expected = {
            'صدای زن زبدینو': 'atomic-habits-sulafat-v1.mp3',
            'صدای مرد زبدینو': 'atomic-habits-schedar-v1.mp3',
          };
          const report = { checkedAt: new Date().toISOString(), cases: [], playback: {}, result: 'running' };
          const assert = (value, message) => { if (!value) throw new Error(message); };

          async function audioState(page) {
            return page.locator('body > audio').evaluate((audio) => ({
              src: audio.currentSrc || audio.src,
              currentTime: audio.currentTime,
              duration: audio.duration,
              paused: audio.paused,
            }));
          }

          async function visual(browser, name, viewport, dark) {
            const context = await browser.newContext({ viewport, colorScheme: dark ? 'dark' : 'light' });
            const page = await context.newPage();
            await page.goto(url, { waitUntil: 'networkidle', timeout: 60000 });
            if (dark) await page.evaluate(() => document.documentElement.classList.add('dark'));
            await page.waitForTimeout(300);
            const data = await page.evaluate(() => {
              const doc = document.documentElement;
              const h1 = document.querySelector('h1');
              const player = document.querySelector('#player');
              const unlabeledButtons = [...document.querySelectorAll('button')].filter((button) => {
                const text = (button.textContent || '').trim();
                return !text && !button.getAttribute('aria-label') && !button.getAttribute('aria-labelledby');
              }).length;
              return {
                scrollWidth: doc.scrollWidth,
                clientWidth: doc.clientWidth,
                scrollHeight: doc.scrollHeight,
                h1: (h1?.textContent || '').trim(),
                player: Boolean(player),
                unlabeledButtons,
              };
            });
            await page.screenshot({ path: `.qa-book-uiux/${name}.png`, fullPage: true });
            report.cases.push({ name, viewport, dark, ...data });
            assert(data.scrollWidth <= data.clientWidth + 1, `${name}: horizontal overflow`);
            assert(data.h1.includes('عادت‌های اتمی'), `${name}: book heading missing`);
            assert(data.player, `${name}: player missing`);
            assert(data.unlabeledButtons === 0, `${name}: unlabeled buttons ${data.unlabeledButtons}`);
            await context.close();
          }

          async function playback(browser) {
            const context = await browser.newContext({ viewport: { width: 1440, height: 1000 } });
            const page = await context.newPage();
            await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 60000 });
            const player = page.locator('#player');
            const group = player.getByRole('group', { name: 'انتخاب صدای روایت' });
            await group.waitFor({ state: 'visible', timeout: 30000 });

            const female = group.getByRole('button', { name: 'صدای زن زبدینو', exact: true });
            if ((await female.getAttribute('aria-pressed')) !== 'true') await female.click();
            await player.getByRole('button', { name: 'شروع پخش', exact: true }).click();
            await page.waitForFunction(() => {
              const audio = document.querySelector('body > audio');
              return audio && !audio.paused && audio.currentTime > 0.4;
            }, null, { timeout: 30000 });
            const femaleState = await audioState(page);
            assert(femaleState.src.includes(expected['صدای زن زبدینو']), `female source mismatch ${femaleState.src}`);
            assert(Number.isFinite(femaleState.duration) && femaleState.duration > 800, `female duration invalid ${femaleState.duration}`);
            await player.getByRole('button', { name: 'توقف پخش', exact: true }).click();

            const beforeSwitch = (await audioState(page)).currentTime;
            await group.getByRole('button', { name: 'صدای مرد زبدینو', exact: true }).click();
            await page.waitForTimeout(500);
            const switched = await audioState(page);
            assert(switched.src.includes(expected['صدای مرد زبدینو']), `male source mismatch ${switched.src}`);
            assert(switched.paused, 'voice switch autoplayed unexpectedly');
            assert(Math.abs(switched.currentTime - beforeSwitch) < 5, `timestamp not preserved ${beforeSwitch} -> ${switched.currentTime}`);

            report.playback = { femaleState, beforeSwitch, switched };
            await context.close();
          }

          const browser = await chromium.launch({ headless: true, args: ['--autoplay-policy=no-user-gesture-required'] });
          try {
            await visual(browser, 'desktop-book-light', { width: 1440, height: 1000 }, false);
            await visual(browser, 'desktop-book-dark', { width: 1440, height: 1000 }, true);
            await visual(browser, 'mobile-book-light', { width: 390, height: 844 }, false);
            await visual(browser, 'mobile-book-dark', { width: 390, height: 844 }, true);
            await playback(browser);
            report.result = 'pass';
          } catch (error) {
            report.result = 'fail';
            report.error = error instanceof Error ? error.stack || error.message : String(error);
            throw error;
          } finally {
            await fs.writeFile('.qa-book-uiux/report.json', JSON.stringify(report, null, 2));
            await browser.close();
          }
          EOF
          node .qa-runner/book-detail-player-qa.mjs

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uiux-book-detail-player-${{ github.run_id }}
          path: .qa-book-uiux
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
