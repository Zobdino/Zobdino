name: Zobdino Success Audio Artifact Bootstrap

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/ops-success-audio-artifact-bootstrap.yml

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch quota-safe audio completion with success artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run dual-voice-quota-safe.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f batch=batch-a-atomic \
            -f resume_run_id=33846178111 \
            -f auto_resume_remaining=3
          echo "Dispatched quota-safe Atomic Habits audio completion from durable Run #22 checkpoint."
