name: Issue 161 apply expired Interaction fix v3

on:
  push:
    branches:
      - fix/161-expired-resume-interaction-404
    paths:
      - .github/workflows/issue-161-apply-fix-v3.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/161-expired-resume-interaction-404
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply deterministic source edit
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('scripts/dual-voice-render.mjs')
          text = path.read_text(encoding='utf-8')

          if 'function isExpiredResumedInteractionError(error)' not in text:
              marker = 'async function resolveAcceptedInteraction(\n'
              helper = '''function isExpiredResumedInteractionError(error) {
            const message = String(error?.message ?? error);

            if (!message.startsWith("Gemini interaction GET HTTP 404:")) {
              return false;
            }

            return (
              /"code"\\s*:\\s*"not_found"/iu.test(message) ||
              /"status"\\s*:\\s*"NOT_FOUND"/u.test(message) ||
              /\\bnot[_ -]?found\\b/iu.test(message) ||
              /requested entity was not found/iu.test(message)
            );
          }

          async function resolveAcceptedInteraction(
          '''
              if marker not in text:
                  raise SystemExit('resolveAcceptedInteraction marker not found')
              text = text.replace(marker, helper, 1)

          pending_pattern = re.compile(
              r'''  const generated = await resolveInteraction\(\n'''
              r'''\s*apiKey,\n\s*\{\n\s*id: String\(entry\.interactionId\),\n'''
              r'''\s*status: "in_progress",\n\s*steps: \[\],\n\s*\},\n\s*voice,\n\s*\);'''
          )
          pending_replacement = '''  let generated;

            try {
              generated = await resolveInteraction(
                apiKey,
                {
                  id: String(entry.interactionId),
                  status: "in_progress",
                  steps: [],
                },
                voice,
              );
            } catch (error) {
              if (!isExpiredResumedInteractionError(error)) {
                throw error;
              }

              await unlink(pendingFile).catch(() => {});

              console.log(
                "Dual-voice expired pending Interaction retired: " +
                `${path.relative(outRoot, wav).replaceAll("\\\\", "/")}; ` +
                `interactionId=${entry.interactionId}; provider=404/not_found; ` +
                "allowing one fresh generation POST.",
              );

              return null;
            }'''
          text, pending_count = pending_pattern.subn(pending_replacement, text, count=1)
          if pending_count != 1:
              raise SystemExit(f'resumePendingInteraction replacement count={pending_count}')

          segment_pattern = re.compile(
              r'''  const generated =\n\s*await resolveAcceptedInteraction\(\n'''
              r'''\s*apiKey,\n\s*\{\n\s*id: String\(pending\.interactionId\),\n'''
              r'''\s*status: "in_progress",\n\s*steps: \[\],\n\s*\},\n\s*voice,\n\s*\);'''
          )
          segment_replacement = '''  let generated;

            try {
              generated =
                await resolveAcceptedInteraction(
                  apiKey,
                  {
                    id: String(pending.interactionId),
                    status: "in_progress",
                    steps: [],
                  },
                  voice,
                );
            } catch (error) {
              if (!isExpiredResumedInteractionError(error)) {
                throw error;
              }

              await unlink(files.pending).catch(() => {});

              console.log(
                "Dual-voice expired segment Interaction retired: " +
                `${relativePath}; interactionId=${pending.interactionId}; ` +
                "provider=404/not_found; allowing one fresh generation POST.",
              );

              return null;
            }'''
          text, segment_count = segment_pattern.subn(segment_replacement, text, count=1)
          if segment_count != 1:
              raise SystemExit(f'resumeSegmentPendingInteraction replacement count={segment_count}')

          if 'Expired pending Interaction 404 retirement self-test failed.' not in text:
              phrase = '"Dual-voice pending Interaction checkpoint PASS: " +'
              phrase_index = text.find(phrase)
              if phrase_index < 0:
                  raise SystemExit('pending Interaction PASS phrase not found')
              insert_at = text.rfind('  console.log(', 0, phrase_index)
              if insert_at < 0:
                  raise SystemExit('pending Interaction console insertion point not found')

              regression = '''  let expiredResolveCalls = 0;
            const expired = await resumePendingInteraction({
              apiKey: "self-test-key",
              resumeMetadata: {
                schemaVersion: 1,
                batch: "batch-a-atomic",
                chunks: [],
                pendingInteractions: [
                  {
                    schemaVersion: 1,
                    bookSlug: "atomic-habits",
                    role: "female",
                    providerVoice: "Sulafat",
                    chunkIndex: chunk.index,
                    relativePath: "atomic-habits/female/chunks/01.wav",
                    spokenScriptSha256: sha256(spokenText),
                    spokenChunkSha256: sha256(chunk.text),
                    interactionId: "v1_pending-expired-self-test",
                    pollWindowsUsed: 1,
                    sourceRunId: 790,
                    sourceSha: "5555555555555555555555555555555555555555",
                    artifactId: 988,
                    artifactDigest: "sha256:" + "6".repeat(64),
                  },
                ],
              },
              pendingFile: selfTestPending,
              outRoot: selfTestRoot,
              wav: selfTestWav,
              bookSlug: "atomic-habits",
              role: "female",
              voice: "Sulafat",
              spokenText,
              chunk,
              dependencies: {
                resolveAcceptedInteraction: async () => {
                  expiredResolveCalls += 1;
                  throw new Error(
                    'Gemini interaction GET HTTP 404: {"error":{"code":"not_found","status":"NOT_FOUND","message":"Requested entity was not found."}}',
                  );
                },
              },
            });

            const expiredPendingStillExists = await fileExists(selfTestPending);
            await unlink(selfTestPending).catch(() => {});

            if (expired !== null || expiredResolveCalls !== 1 || expiredPendingStillExists) {
              throw new Error(
                "Expired pending Interaction 404 retirement self-test failed.",
              );
            }

          '''
              text = text[:insert_at] + regression + text[insert_at:]

          text = text.replace(
              '"stale ID retires before one fresh generation POST.",',
              '"stale/expired IDs retire before one fresh generation POST.",',
              1,
          )

          path.write_text(text, encoding='utf-8')

      - name: Syntax check
        run: node --check scripts/dual-voice-render.mjs

      - name: Install dependencies
        run: npm ci

      - name: Validate
        run: |
          npm run lint
          npm run typecheck
          npm run voice:dual:resume:validate
          git diff --check

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/dual-voice-render.mjs
          git commit -m "fix: retire expired resumed Gemini interactions"
          git push origin HEAD:fix/161-expired-resume-interaction-404
