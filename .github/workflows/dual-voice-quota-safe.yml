name: Zobdino Dual-Voice Quota-Safe Checkpoint

on:
  workflow_dispatch:
    inputs:
      batch:
        description: Dual-voice batch
        required: true
        default: batch-a-atomic
        type: string
      resume_run_id:
        description: Optional failed run ID to restore first
        required: false
        default: ""
        type: string
      auto_resume_remaining:
        description: Automatic quota-safe continuation hops remaining
        required: false
        default: "3"
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: zobdino-dual-voice-quota-safe
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_TTS_MODEL: ${{ vars.GEMINI_TTS_MODEL || 'gemini-3.1-flash-tts-preview' }}

    steps:
      - name: Checkout exact dispatch ref
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install and verify FFmpeg runtime
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffprobe >/dev/null 2>&1 || ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffprobe -version | head -n 1
          ffmpeg -version | head -n 1

      - name: Validate quota-paused classifier
        run: node scripts/dual-voice-quota-state-self-test.mjs

      - name: Validate repository and dual-voice contracts
        shell: bash
        run: |
          set -euo pipefail
          npm run check:text
          npm run check:episodes
          node scripts/dual-voice-render.mjs \
            --mode validate \
            --batch "${{ inputs.batch }}" \
            --out .dual-voice

      - name: Restore verified checkpoint
        if: ${{ inputs.resume_run_id != '' }}
        shell: bash
        env:
          RESUME_RUN_ID: ${{ inputs.resume_run_id }}
        run: |
          set -euo pipefail
          [[ "$RESUME_RUN_ID" =~ ^[0-9]+$ ]] || {
            echo "::error::resume_run_id must be numeric."
            exit 1
          }

          ARTIFACT_NAME="dual-voice-failed-${{ inputs.batch }}-$RESUME_RUN_ID"
          rm -rf .resume-artifact
          mkdir -p .resume-artifact .dual-voice

          gh run download "$RESUME_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$ARTIFACT_NAME" \
            --dir .resume-artifact

          RUN_JSON="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RESUME_RUN_ID")"
          SOURCE_SHA="$(jq -r '.head_sha' <<<"$RUN_JSON")"
          ARTIFACTS="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RESUME_RUN_ID/artifacts?per_page=100")"
          ARTIFACT_ID="$(jq -r --arg name "$ARTIFACT_NAME" '.artifacts[] | select(.name == $name and .expired == false) | .id' <<<"$ARTIFACTS")"
          ARTIFACT_DIGEST="$(jq -r --arg name "$ARTIFACT_NAME" '.artifacts[] | select(.name == $name and .expired == false) | .digest' <<<"$ARTIFACTS")"

          node scripts/dual-voice-resume-seed.mjs \
            --seed .resume-artifact \
            --out .dual-voice \
            --batch "${{ inputs.batch }}" \
            --source-run "$RESUME_RUN_ID" \
            --source-sha "$SOURCE_SHA" \
            --artifact-digest "$ARTIFACT_DIGEST" \
            --artifact-id "$ARTIFACT_ID"

      - name: Generate with bounded in-run quota backoff
        id: generate
        shell: bash
        env:
          IN_RUN_QUOTA_RETRIES: "3"
        run: |
          set -euo pipefail
          RESUME_ARGS=()
          if [[ -f .dual-voice/resume-index.json ]]; then
            RESUME_ARGS=(--resume-metadata .dual-voice/resume-index.json)
          fi

          attempt=0
          while true; do
            rm -f .dual-voice/quota-paused.json
            set +e
            node scripts/dual-voice-quota-safe-runner.mjs \
              --mode generate \
              --batch "${{ inputs.batch }}" \
              --out .dual-voice \
              "${RESUME_ARGS[@]}"
            CODE=$?
            set -e

            if [[ "$CODE" == "0" ]]; then
              echo "quota_paused=false" >> "$GITHUB_OUTPUT"
              echo "completed=true" >> "$GITHUB_OUTPUT"
              echo "Generation completed inside the current workflow run."
              exit 0
            fi

            if [[ "$CODE" != "75" ]]; then
              echo "::error::Dual-voice generation failed with non-quota exit code $CODE."
              exit "$CODE"
            fi

            if (( attempt >= IN_RUN_QUOTA_RETRIES )); then
              echo "quota_paused=true" >> "$GITHUB_OUTPUT"
              echo "completed=false" >> "$GITHUB_OUTPUT"
              echo "In-run quota retry budget exhausted; preserving durable checkpoint for cross-run continuation."
              exit 0
            fi

            RETRY_AFTER_MS="$(jq -r '.retryAfterMs // 60000' .dual-voice/quota-paused.json 2>/dev/null || echo 60000)"
            [[ "$RETRY_AFTER_MS" =~ ^[0-9]+$ ]] || RETRY_AFTER_MS=60000
            WAIT_SECONDS=$(( (RETRY_AFTER_MS + 999) / 1000 + 8 ))
            if (( WAIT_SECONDS < 20 )); then WAIT_SECONDS=20; fi
            if (( WAIT_SECONDS > 120 )); then WAIT_SECONDS=120; fi
            attempt=$(( attempt + 1 ))

            echo "Short quota window detected; preserving in-workspace checkpoints and retrying in ${WAIT_SECONDS}s (${attempt}/${IN_RUN_QUOTA_RETRIES})."
            sleep "$WAIT_SECONDS"
          done

      - name: Upload durable checkpoint
        if: ${{ always() && (steps.generate.outputs.quota_paused == 'true' || failure()) }}
        uses: actions/upload-artifact@v7
        with:
          name: dual-voice-failed-${{ inputs.batch }}-${{ github.run_id }}
          path: .dual-voice
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true

      - name: Verify quota-paused manifest
        if: ${{ steps.generate.outputs.quota_paused == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          test -s .dual-voice/quota-paused.json
          jq -e '.schemaVersion == 1 and .state == "quota-paused" and .batch == "${{ inputs.batch }}"' \
            .dual-voice/quota-paused.json >/dev/null
          echo "Quota-paused manifest PASS"

      - name: Auto-dispatch bounded continuation
        if: ${{ steps.generate.outputs.quota_paused == 'true' }}
        shell: bash
        env:
          AUTO_RESUME_REMAINING: ${{ inputs.auto_resume_remaining }}
        run: |
          set -euo pipefail
          [[ "$AUTO_RESUME_REMAINING" =~ ^[0-9]+$ ]] || {
            echo "::error::auto_resume_remaining must be a non-negative integer."
            exit 1
          }

          if (( AUTO_RESUME_REMAINING <= 0 )); then
            echo "Automatic continuation budget exhausted; durable checkpoint remains available."
            exit 0
          fi

          RETRY_AFTER_MS="$(jq -r '.retryAfterMs // 15000' .dual-voice/quota-paused.json)"
          [[ "$RETRY_AFTER_MS" =~ ^[0-9]+$ ]] || RETRY_AFTER_MS=15000
          WAIT_SECONDS=$(( (RETRY_AFTER_MS + 999) / 1000 + 5 ))
          if (( WAIT_SECONDS < 10 )); then WAIT_SECONDS=10; fi
          if (( WAIT_SECONDS > 60 )); then WAIT_SECONDS=60; fi
          NEXT_REMAINING=$(( AUTO_RESUME_REMAINING - 1 ))

          echo "Quota-safe continuation: waiting ${WAIT_SECONDS}s, then dispatching from run ${GITHUB_RUN_ID}; remaining hops=${NEXT_REMAINING}."
          sleep "$WAIT_SECONDS"

          gh workflow run dual-voice-quota-safe.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_REF_NAME" \
            -f batch="${{ inputs.batch }}" \
            -f resume_run_id="$GITHUB_RUN_ID" \
            -f auto_resume_remaining="$NEXT_REMAINING"

      - name: Generation completed
        if: ${{ steps.generate.outputs.completed == 'true' }}
        run: echo "Generation completed without quota exhaustion; hand off to the existing QA/release workflow."
