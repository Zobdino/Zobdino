name: UIUX Upload Result Preview QA

on:
  push:
    branches:
      - design/253-upload-result-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Quality gates
        run: |
          npm run lint
          npm run typecheck
          npm run check:text
          npm run check:episodes
          npm run runtime:user-files:validate
          npm run build

      - name: Install Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Serve branch build
        shell: bash
        run: |
          python3 -m http.server 4173 --directory out > /tmp/zobdino-upload-uiux.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/upload/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/zobdino-upload-uiux.log
          exit 1

      - name: Chromium upload and result acceptance
        shell: bash
        run: |
          mkdir -p .qa-upload-uiux .qa-runner
          cat > .qa-runner/upload-result-qa.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs/promises';

          const base = 'http://127.0.0.1:4173';
          const report = { checkedAt: new Date().toISOString(), cases: [], result: 'running' };
          const assert = (value, message) => { if (!value) throw new Error(message); };

          async function inspect(browser, path, name, viewport, dark = false) {
            const context = await browser.newContext({ viewport, colorScheme: dark ? 'dark' : 'light' });
            const page = await context.newPage();
            await page.goto(base + path, { waitUntil: 'networkidle', timeout: 60000 });
            if (dark) await page.evaluate(() => document.documentElement.classList.add('dark'));
            await page.waitForTimeout(300);

            const data = await page.evaluate(() => {
              const doc = document.documentElement;
              const h1 = document.querySelector('h1');
              const unlabeledButtons = [...document.querySelectorAll('button')].filter((button) => {
                const text = (button.textContent || '').trim();
                return !text && !button.getAttribute('aria-label') && !button.getAttribute('aria-labelledby');
              }).length;
              const imagesWithoutAlt = [...document.querySelectorAll('img')].filter((img) => !img.hasAttribute('alt')).length;
              return {
                title: document.title,
                scrollWidth: doc.scrollWidth,
                clientWidth: doc.clientWidth,
                scrollHeight: doc.scrollHeight,
                h1: (h1?.textContent || '').replace(/\s+/g, ' ').trim(),
                unlabeledButtons,
                imagesWithoutAlt,
              };
            });

            await page.screenshot({ path: `.qa-upload-uiux/${name}.png`, fullPage: true });
            report.cases.push({ name, path, viewport, dark, ...data });

            assert(data.scrollWidth <= data.clientWidth + 1, `${name}: horizontal overflow ${data.scrollWidth}/${data.clientWidth}`);
            assert(data.h1.length > 10, `${name}: primary heading missing`);
            assert(data.unlabeledButtons === 0, `${name}: unlabeled buttons ${data.unlabeledButtons}`);
            assert(data.imagesWithoutAlt === 0, `${name}: images without alt ${data.imagesWithoutAlt}`);
            await context.close();
          }

          const browser = await chromium.launch({ headless: true });
          try {
            for (const dark of [false, true]) {
              const suffix = dark ? 'dark' : 'light';
              await inspect(browser, '/upload/', `desktop-upload-${suffix}`, { width: 1440, height: 1000 }, dark);
              await inspect(browser, '/upload/result-preview/', `desktop-result-${suffix}`, { width: 1440, height: 1000 }, dark);
              await inspect(browser, '/upload/', `mobile-upload-${suffix}`, { width: 390, height: 844 }, dark);
              await inspect(browser, '/upload/result-preview/', `mobile-result-${suffix}`, { width: 390, height: 844 }, dark);
            }
            report.result = 'pass';
          } catch (error) {
            report.result = 'fail';
            report.error = error instanceof Error ? error.stack || error.message : String(error);
            throw error;
          } finally {
            await fs.writeFile('.qa-upload-uiux/report.json', JSON.stringify(report, null, 2));
            await browser.close();
          }
          EOF
          node .qa-runner/upload-result-qa.mjs

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uiux-upload-result-${{ github.run_id }}
          path: .qa-upload-uiux
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
