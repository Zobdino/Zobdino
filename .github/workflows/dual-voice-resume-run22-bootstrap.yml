name: Zobdino Dual-Voice Run22 Resume Bootstrap

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/dual-voice-resume-run22-bootstrap.yml

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Dispatch quota-safe continuation from Run #22 checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run dual-voice-quota-safe.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f batch=batch-a-atomic \
            -f resume_run_id=33846178111 \
            -f auto_resume_remaining=3
          echo "Dispatched dual-voice quota-safe continuation from durable Run #22 checkpoint."
