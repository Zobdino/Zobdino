name: Zobdino QA226 Rerun Bootstrap

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/qa226-rerun-bootstrap.yml

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch pinned completed-audio QA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run completed-audio-artifact-qa.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f source_run_id=33852342391 \
            -f artifact_id=9929053519 \
            -f artifact_name=dual-voice-completed-batch-a-atomic-33852342391 \
            -f artifact_digest=sha256:fb19430257bb1e2a2f8bf19f9272f2033079271ab1e9f94a3e60f82e7f1e7a2c \
            -f source_head_sha=7f01c43ee0a9989794d614b035a365db0ae90e3d
          echo "Pinned QA rerun dispatched; no TTS generation or media promotion performed."
